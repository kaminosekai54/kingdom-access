name = kingdomAccessSleep
summary = "Kingdom Access: NVDA sleep mode for Kingdom Two Crowns"
description = """Puts NVDA in sleep mode while Kingdom Two Crowns has the focus, so that game keys no longer interrupt speech. The Kingdom Access mod keeps speaking through NVDA. Press NVDA+Shift+S to leave or re-enter sleep mode at any time."""
