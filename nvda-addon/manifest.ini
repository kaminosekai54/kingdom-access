name = kingdomAccessKeys
summary = "Kingdom Access: game keys do not interrupt speech in Kingdom Two Crowns"
description = """While Kingdom Two Crowns has the focus, key presses no longer interrupt NVDA's speech, so the Kingdom Access mod announcements are not cut at every move. The mod itself interrupts speech when it has something new to say. Normal NVDA behaviour comes back as soon as another window has the focus."""
author = "Alexis (kaminosekai54)"
url = https://github.com/kaminosekai54/kingdom-access
version = 1.1.0
minimumNVDAVersion = 2024.1.0
lastTestedNVDAVersion = 2026.2.0
